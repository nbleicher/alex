<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="api-base" content="https://api.alex.jawnix.com" />
  <title>Savage Peptides</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" href="consumer.css" />
  <script>window.API_BASE_URL = document.querySelector('meta[name="api-base"]')?.getAttribute('content') || '';</script>
</head>
<body>
  <header class="consumer-header">
    <div></div>
    <h1>SAVAGE PEPTIDES</h1>
    <div class="header-actions">
      <button id="openCart" class="icon-btn cart-btn" title="Cart" aria-label="Open cart">
        <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="cart-basket" d="M8 8h11l-1.4 6.1c-.16.7-.78 1.2-1.5 1.2H10.2c-.72 0-1.34-.5-1.5-1.2L7.2 6.4H4.6a1 1 0 1 1 0-2H8a1 1 0 0 1 .98.8L9.4 7h9.9a1 1 0 0 1 .98 1.23l-.04.17Z"></path>
          <path class="cart-handle" d="M9.2 6h9.1a1 1 0 0 1 0 2H9.8"></path>
          <circle class="cart-wheel wheel-left" cx="11" cy="18.5" r="1.8"></circle>
          <circle class="cart-wheel wheel-right" cx="16.8" cy="18.5" r="1.8"></circle>
          <circle class="cart-wheel-core" cx="11" cy="18.5" r="0.7"></circle>
          <circle class="cart-wheel-core" cx="16.8" cy="18.5" r="0.7"></circle>
        </svg>
        <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  <button id="openAdmin" class="icon-btn admin-cog-bottom-left" title="Admin">⚙</button>

  <main>
    <section id="productGrid" class="product-grid"></section>
  </main>

  <div class="modal" id="cartModal" aria-hidden="true">
    <div class="card">
      <div class="card-header">
        <h2>Cart</h2>
        <button class="close-btn" id="closeCart">×</button>
      </div>
      <div id="cartItems"></div>
      <div class="actions">
        <button id="checkoutBtn">Checkout</button>
      </div>
    </div>
  </div>

  <div class="modal" id="checkoutModal" aria-hidden="true">
    <div class="card">
      <div class="card-header">
        <h2>Checkout</h2>
        <button class="close-btn" id="closeCheckout">×</button>
      </div>
      <form id="checkoutForm" class="checkout-form">
        <label>First name <input id="firstName" required /></label>
        <label>Last name <input id="lastName" required /></label>
        <label>Phone number <input id="phone" required /></label>
        <label>Referral <input id="referral" /></label>
        <button type="submit">Submit order</button>
      </form>
      <div id="checkoutError" class="error"></div>
    </div>
  </div>

  <div class="modal" id="confirmationModal" aria-hidden="true">
    <div class="card">
      <h2>Order submitted</h2>
      <p id="confirmationText"></p>
      <button id="closeConfirmation">Close</button>
    </div>
  </div>

  <div class="modal" id="adminLoginModal" aria-hidden="true">
    <div class="card">
      <div class="card-header">
        <h2>Admin login</h2>
        <button class="close-btn" id="closeAdminLogin" aria-label="Close">×</button>
      </div>
      <form id="adminLoginForm" class="checkout-form">
        <label>Username <input id="adminUsername" required /></label>
        <label>Password <input id="adminPassword" type="password" required /></label>
        <button type="submit">Login</button>
      </form>
      <div id="adminLoginError" class="error"></div>
    </div>
  </div>

  <script type="module" src="consumer.js"></script>
</body>
</html>
