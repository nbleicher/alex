<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="api-base" content="https://api.alex.jawnix.com" />
  <title>Savage Peptides</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" href="consumer.css" />
  <script>window.API_BASE_URL = document.querySelector('meta[name="api-base"]')?.getAttribute('content') || '';</script>
</head>
<body>
  <header class="consumer-header">
    <div></div>
    <h1>SAVAGE PEPTIDES</h1>
    <div class="header-actions">
      <button id="openAdmin" class="icon-btn" title="Admin">⚙</button>
      <button id="openCart" class="icon-btn cart-btn" title="Cart">🛒 <span id="cartCount">0</span></button>
    </div>
  </header>

  <main>
    <section id="productGrid" class="product-grid"></section>
  </main>

  <div class="modal" id="cartModal" aria-hidden="true">
    <div class="card">
      <div class="card-header">
        <h2>Cart</h2>
        <button class="close-btn" id="closeCart">×</button>
      </div>
      <div id="cartItems"></div>
      <div class="actions">
        <button id="checkoutBtn">Checkout</button>
      </div>
    </div>
  </div>

  <div class="modal" id="checkoutModal" aria-hidden="true">
    <div class="card">
      <div class="card-header">
        <h2>Checkout</h2>
        <button class="close-btn" id="closeCheckout">×</button>
      </div>
      <form id="checkoutForm" class="checkout-form">
        <label>First name <input id="firstName" required /></label>
        <label>Last name <input id="lastName" required /></label>
        <label>Phone number <input id="phone" required /></label>
        <label>Referral <input id="referral" /></label>
        <button type="submit">Submit order</button>
      </form>
      <div id="checkoutError" class="error"></div>
    </div>
  </div>

  <div class="modal" id="confirmationModal" aria-hidden="true">
    <div class="card">
      <h2>Order submitted</h2>
      <p id="confirmationText"></p>
      <button id="closeConfirmation">Close</button>
    </div>
  </div>

  <script type="module" src="consumer.js"></script>
</body>
</html>
